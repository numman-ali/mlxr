[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "packages/families/ltx",
    "packages/clients/runtime-cli",
    "packages/core/runtime-mlx-models",
    "packages/core/runtime-core",
    "packages/core/runtime-server",
    "packages/core/runtime-workflows",
    "packages/core/shared-schemas",
]

[tool.uv.sources]
mlx-runtime-cli = { workspace = true }
mlx-runtime-core = { workspace = true }
mlx-runtime-mlx-models = { workspace = true }
mlx-runtime-family-ltx = { workspace = true }
mlx-runtime-schemas = { workspace = true }
mlx-runtime-server = { workspace = true }
mlx-runtime-workflows = { workspace = true }

[dependency-groups]
dev = [
    "coverage[toml]>=7.10.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "mlx-runtime-cli",
    "mlx-runtime-core",
    "mlx-runtime-mlx-models",
    "mlx-runtime-family-ltx",
    "mlx-runtime-schemas",
    "mlx-runtime-server",
    "mlx-runtime-workflows",
    "mypy>=1.18.0",
    "pre-commit>=4.3.0",
    "pydantic>=2.10.0",
    "ruff>=0.14.0",
    "typing-extensions>=4.12.0",
    "uvicorn>=0.30.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
files = ["packages", "tests", "scripts"]

[tool.coverage.run]
branch = true
source = ["packages"]
data_file = "tmp/.coverage"

[tool.coverage.report]
fail_under = 85
omit = [
    "tests/*",
    "packages/families/ltx/src/mlxr/families/ltx/_audio_vocoder.py",
    "packages/families/ltx/src/mlxr/families/ltx/_generation_backend_legacy.py",
    "packages/families/ltx/src/mlxr/families/ltx/_prompt_encoding_backend_legacy.py",
    "packages/families/ltx/src/mlxr/families/ltx/_prompt_encoding_backend/*",
    "packages/families/ltx/src/mlxr/families/ltx/_generation_backend/*",
]
