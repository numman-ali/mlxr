[project]
name = "mlx-runtime-mlx-models"
version = "0.1.0"
description = "Repo-owned shared MLX model substrate for MLXR"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.22.0",
    "numpy",
    "transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlxr"]
