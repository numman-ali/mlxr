[project]
name = "mlx-runtime-family-z-image"
version = "0.1.0"
description = "Z-Image family adapter for MLXR"
requires-python = ">=3.12"
dependencies = [
    "mlx-runtime-core",
    "mlx-runtime-schemas",
    "mlx-runtime-workflows",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlxr"]
