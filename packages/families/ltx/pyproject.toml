[project]
name = "mlx-runtime-family-ltx"
version = "0.1.0"
description = "LTX family adapter scaffold for MLXR"
requires-python = ">=3.12"
dependencies = [
    "mlx-runtime-core",
    "mlx-runtime-schemas",
    "mlx-runtime-workflows",
    "mlx>=0.22.0",
    "mlx-vlm",
    "numpy",
    "pillow",
    "safetensors",
    "sentencepiece",
    "transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltx"]
